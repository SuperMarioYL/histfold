<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" data-palette="d056e6-e76ab7-d0acf6-06806248da20" role="img" aria-labelledby="process-light-title process-light-desc"><title id="process-light-title">How a fold happens</title><desc id="process-light-desc">The commit stream and session logs enter correlation; commits are attributed with 90/70/50/20 percent confidence and changesets come out with intent and review status, while human commits pass through unattributed.</desc><style>text{font-family:Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans',sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.flow{stroke-dasharray:6 7;animation:flow 5.5s linear infinite}.flow-slow{stroke-dasharray:4 9;animation:flow 8s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.pulse-slow{animation:pulse 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-390}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="440" fill="#fdf9fe"/><rect width="1000" height="440" fill="url(#grid)" opacity=".5"/><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#d056e6"/><stop offset=".55" stop-color="#e76ab7"/>
<stop offset="1" stop-color="#d0acf6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#d056e6" stop-opacity="0.14"/>
<stop offset="1" stop-color="#d056e6" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#f0cbf7" stroke-opacity=".33" stroke-width=".6"/>
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
<path d="m1 1 7 4-7 4" fill="none" stroke="#d056e6" stroke-width="1.6"/></marker>
</defs><rect x="24" y="22" width="3" height="26" rx="1.5" fill="" stroke="#aa46bb" stroke-width="1"/><text x="40" y="38" fill="#6e5e88" font-size="12.5" letter-spacing="2">FOLD / FROM COMMITS TO CHANGESETS</text><text x="40" y="74" fill="#241630" font-size="27" font-weight="600">Histfold / how a fold happens</text><rect x="40" y="108" width="270" height="284" rx="10" fill="#fdf7fe" stroke="#f0cbf7" stroke-width="1"/><text x="58" y="138" fill="#d056e6" font-size="17" font-weight="600">01  Collect</text><text x="58" y="164" fill="#6e5e88" font-size="12.5">git log --numstat + session logs</text><circle cx="66" cy="186" r="3.4" fill="#6e5e88" opacity=".55"/><line x1="78" y1="190" x2="290" y2="190" stroke="#f0cbf7" stroke-width="1.2"/><circle cx="66" cy="204" r="3.4" fill="#e76ab7" opacity=".95"/><line x1="78" y1="208" x2="290" y2="208" stroke="#f0cbf7" stroke-width="1.2"/><text x="290" y="211.5" fill="#e76ab7" font-size="9.5" text-anchor="end">trailer</text><circle cx="66" cy="222" r="3.4" fill="#6e5e88" opacity=".55"/><line x1="78" y1="226" x2="290" y2="226" stroke="#f0cbf7" stroke-width="1.2"/><circle cx="66" cy="240" r="3.4" fill="#e76ab7" opacity=".95"/><line x1="78" y1="244" x2="290" y2="244" stroke="#f0cbf7" stroke-width="1.2"/><text x="290" y="247.5" fill="#e76ab7" font-size="9.5" text-anchor="end">trailer</text><circle cx="66" cy="258" r="3.4" fill="#6e5e88" opacity=".55"/><line x1="78" y1="262" x2="290" y2="262" stroke="#f0cbf7" stroke-width="1.2"/><circle cx="66" cy="276" r="3.4" fill="#6e5e88" opacity=".55"/><line x1="78" y1="280" x2="290" y2="280" stroke="#f0cbf7" stroke-width="1.2"/><circle cx="66" cy="294" r="3.4" fill="#e76ab7" opacity=".95"/><line x1="78" y1="298" x2="290" y2="298" stroke="#f0cbf7" stroke-width="1.2"/><text x="290" y="301.5" fill="#e76ab7" font-size="9.5" text-anchor="end">trailer</text><circle cx="66" cy="312" r="3.4" fill="#6e5e88" opacity=".55"/><line x1="78" y1="316" x2="290" y2="316" stroke="#f0cbf7" stroke-width="1.2"/><line x1="58" y1="340" x2="292" y2="340" stroke="#f0cbf7" stroke-width="1" opacity=".8"/><text x="58" y="366" fill="#6e5e88" font-size="12.5">8 session logs discovered</text><rect x="370" y="108" width="240" height="284" rx="10" fill="#fdf7fe" stroke="#d056e6" stroke-width="1.3"/><text x="388" y="138" fill="#d056e6" font-size="17" font-weight="600">02  Correlate</text><text x="388" y="164" fill="#6e5e88" font-size="12.5">pure functions, no I/O</text><rect x="388" y="192" width="204" height="32" rx="7" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><circle cx="404" cy="208" r="4" fill="#d056e6" class="pulse-slow"/><text x="418" y="213" fill="#241630" font-size="13">activity window</text><rect x="388" y="236" width="204" height="32" rx="7" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><circle cx="404" cy="252" r="4" fill="#d056e6" class="pulse-slow"/><text x="418" y="257" fill="#241630" font-size="13">touched-path overlap</text><rect x="388" y="280" width="204" height="32" rx="7" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><circle cx="404" cy="296" r="4" fill="#d056e6" class="pulse-slow"/><text x="418" y="301" fill="#241630" font-size="13">agent trailers</text><text x="388" y="336" fill="#6e5e88" font-size="12">each commit is matched</text><text x="388" y="356" fill="#6e5e88" font-size="12">against every session</text><rect x="670" y="108" width="290" height="284" rx="10" fill="#fdf7fe" stroke="#f0cbf7" stroke-width="1"/><text x="688" y="138" fill="#d056e6" font-size="17" font-weight="600">03  Changesets</text><text x="688" y="164" fill="#6e5e88" font-size="12.5">intent . agent . review</text><rect x="688" y="182" width="254" height="48" rx="8" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="702" y="202" fill="#241630" font-size="13">Add cursor pagination</text><text x="702" y="220" fill="#6e5e88" font-size="11">Claude</text><rect x="860" y="191" width="44" height="18" rx="9" fill="#d056e6" stroke="none" stroke-width="1" opacity=".92"/><text x="882" y="204" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle">90%</text><text x="914" y="204" fill="#6e5e88" font-size="10.5">on-main</text><rect x="688" y="240" width="254" height="48" rx="8" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="702" y="260" fill="#241630" font-size="13">Fix the timezone bug</text><text x="702" y="278" fill="#6e5e88" font-size="11">Claude</text><rect x="860" y="249" width="44" height="18" rx="9" fill="#d056e6" stroke="none" stroke-width="1" opacity=".92"/><text x="882" y="262" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle">90%</text><text x="914" y="262" fill="#6e5e88" font-size="10.5">on-main</text><rect x="688" y="298" width="254" height="48" rx="8" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="702" y="318" fill="#241630" font-size="13">cache: inline lookups</text><text x="702" y="336" fill="#6e5e88" font-size="11">Codex</text><rect x="860" y="307" width="44" height="18" rx="9" fill="#d056e6" stroke="none" stroke-width="1" opacity=".92"/><text x="882" y="320" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle">50%</text><text x="914" y="320" fill="#6e5e88" font-size="10.5">on-main</text><line x1="694" y1="366" x2="936" y2="366" stroke="#f0cbf7" stroke-width="1.2" opacity=".8"/><circle cx="704" cy="366" r="3.6" fill="#6e5e88"/><text x="716" y="370" fill="#6e5e88" font-size="11">human commit passes through unattributed (-)</text><line x1="314" y1="250" x2="364" y2="250" stroke="#d056e6" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><line x1="614" y1="250" x2="664" y2="250" stroke="#d056e6" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><text x="40" y="426" fill="#6e5e88" font-size="12.5">confidence tiers</text><rect x="158" y="411" width="40" height="20" rx="6" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="178" y="426" fill="#d056e6" font-size="11" font-weight="600" text-anchor="middle" class="mono">90%</text><text x="206" y="426" fill="#6e5e88" font-size="11.5">session window + path overlap</text><rect x="411.4" y="411" width="40" height="20" rx="6" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="431.4" y="426" fill="#d056e6" font-size="11" font-weight="600" text-anchor="middle" class="mono">70%</text><text x="459.4" y="426" fill="#6e5e88" font-size="11.5">session window</text><rect x="565.8" y="411" width="40" height="20" rx="6" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="585.8" y="426" fill="#d056e6" font-size="11" font-weight="600" text-anchor="middle" class="mono">50%</text><text x="613.8" y="426" fill="#6e5e88" font-size="11.5">trailers only</text><rect x="713.5999999999999" y="411" width="40" height="20" rx="6" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="733.5999999999999" y="426" fill="#d056e6" font-size="11" font-weight="600" text-anchor="middle" class="mono">20%</text><text x="761.5999999999999" y="426" fill="#6e5e88" font-size="11.5">time gaps</text></svg>