<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" data-palette="d056e6-e76ab7-d0acf6-06806248da20" role="img" aria-labelledby="architecture-dark-mobile-title architecture-dark-mobile-desc"><title id="architecture-dark-mobile-title">One binary, three packages</title><desc id="architecture-dark-mobile-desc">Inside the histfold single binary: ingest shells out to system git and adapts Claude Code session logs, fold is a pure correlation function, render prints a terminal table and writes a self-contained HTML timeline.</desc><style>text{font-family:Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans',sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.flow{stroke-dasharray:6 7;animation:flow 5.5s linear infinite}.flow-slow{stroke-dasharray:4 9;animation:flow 8s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.pulse-slow{animation:pulse 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-390}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="400" height="800" fill="#090712"/><rect width="400" height="800" fill="url(#grid)" opacity=".5"/><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#d056e6"/><stop offset=".55" stop-color="#e76ab7"/>
<stop offset="1" stop-color="#d0acf6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#d056e6" stop-opacity="0.12"/>
<stop offset="1" stop-color="#d056e6" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#351841" stroke-opacity=".33" stroke-width=".6"/>
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
<path d="m1 1 7 4-7 4" fill="none" stroke="#d056e6" stroke-width="1.6"/></marker>
</defs><text x="24" y="44" fill="#ae9cc4" font-size="11.5" letter-spacing="1.2">ARCHITECTURE / ONE BINARY, THREE PACKAGES</text><rect x="24" y="64" width="352" height="60" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="40" y="90" fill="#f6eefd" font-size="12.5">your repo (read-only)</text><text x="40" y="108" fill="#ae9cc4" font-size="9.8" class="mono">git log --numstat . ~/.claude/projects/&lt;slug&gt;/*.jsonl</text><line x1="200" y1="128" x2="200" y2="148" stroke="#d056e6" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="24" y="152" width="352" height="420" rx="14" fill="#12101f" stroke="#d056e6" stroke-width="1.4"/><text x="40" y="182" fill="#f6eefd" font-size="13.5" font-weight="600">histfold - single binary - Go stdlib</text><rect x="40" y="202" width="320" height="104" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="56" y="232" fill="#d056e6" font-size="15.5" font-weight="600">ingest</text><text x="56" y="256" fill="#ae9cc4" font-size="10.5">system git exec . claude jsonl adapter .</text><text x="56" y="272" fill="#ae9cc4" font-size="10.5">trailers</text><rect x="40" y="314" width="320" height="104" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="56" y="344" fill="#d056e6" font-size="15.5" font-weight="600">fold</text><text x="56" y="368" fill="#ae9cc4" font-size="10.5">pure correlation functions . no I/O . one</text><text x="56" y="384" fill="#ae9cc4" font-size="10.5">policy</text><rect x="40" y="426" width="320" height="104" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="56" y="456" fill="#d056e6" font-size="15.5" font-weight="600">render</text><text x="56" y="480" fill="#ae9cc4" font-size="10.5">terminal table . embedded timeline.html .</text><text x="56" y="496" fill="#ae9cc4" font-size="10.5">vanilla JS</text><line x1="200" y1="576" x2="200" y2="596" stroke="#d056e6" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="24" y="600" width="352" height="118" rx="10" fill="#120d1d" stroke="#d056e6" stroke-width="1"/><text x="40" y="628" fill="#f6eefd" font-size="13.5" font-weight="600">outputs</text><text x="40" y="652" fill="#ae9cc4" font-size="10.5">terminal summary: intent . agent . files . review . conf</text><text x="40" y="670" fill="#ae9cc4" font-size="10.5">histfold.html: self-contained, offline, zero requests</text><text x="40" y="688" fill="#ae9cc4" font-size="10.5">stdout JSON via --json</text><text x="24" y="744" fill="#ae9cc4" font-size="11.5">no servers - no daemons - no config files</text></svg>