<svg xmlns="http://www.w3.org/2000/svg" width="400" height="700" viewBox="0 0 400 700" data-palette="d056e6-e76ab7-d0acf6-06806248da20" role="img" aria-labelledby="integrations-dark-mobile-title integrations-dark-mobile-desc"><title id="integrations-dark-mobile-title">What it reads and writes</title><desc id="integrations-dark-mobile-desc">histfold draws evidence from git log, Claude Code session logs and commit trailers, and writes a terminal table, stdout JSON and histfold.html; review status uses local refs only, with no network requests.</desc><style>text{font-family:Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans',sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.flow{stroke-dasharray:6 7;animation:flow 5.5s linear infinite}.flow-slow{stroke-dasharray:4 9;animation:flow 8s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.pulse-slow{animation:pulse 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-390}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="400" height="700" fill="#090712"/><rect width="400" height="700" fill="url(#grid)" opacity=".5"/><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#d056e6"/><stop offset=".55" stop-color="#e76ab7"/>
<stop offset="1" stop-color="#d0acf6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#d056e6" stop-opacity="0.14"/>
<stop offset="1" stop-color="#d056e6" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#351841" stroke-opacity=".33" stroke-width=".6"/>
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
<path d="m1 1 7 4-7 4" fill="none" stroke="#d056e6" stroke-width="1.6"/></marker>
</defs><text x="24" y="44" fill="#ae9cc4" font-size="11.5" letter-spacing="1.2">INTEGRATION / READS AND WRITES</text><circle cx="200" cy="128" r="54" fill="#12101f" stroke="#d056e6" stroke-width="1.4"/><circle cx="200" cy="128" r="68" fill="none" stroke="#d056e6" stroke-opacity=".35" class="pulse-slow"/><text x="200" y="126" fill="#f6eefd" font-size="15" font-weight="600" text-anchor="middle">histfold</text><text x="200" y="144" fill="#ae9cc4" font-size="10" text-anchor="middle">read-only fold</text><text x="24" y="226" fill="#d056e6" font-size="11" font-weight="600" letter-spacing="2.5">READS</text><rect x="24" y="240" width="352" height="50" rx="9" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="38" y="261" fill="#f6eefd" font-size="11.5" font-weight="600" class="mono">git log --numstat</text><text x="38" y="279" fill="#ae9cc4" font-size="10">via the system git binary</text><rect x="24" y="298" width="352" height="50" rx="9" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="38" y="319" fill="#f6eefd" font-size="11.5" font-weight="600" class="mono">~/.claude/projects/*.jsonl</text><text x="38" y="337" fill="#ae9cc4" font-size="10">Claude Code session logs (v0.1)</text><rect x="24" y="356" width="352" height="50" rx="9" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="38" y="377" fill="#f6eefd" font-size="11.5" font-weight="600" class="mono">commit trailers</text><text x="38" y="395" fill="#ae9cc4" font-size="10">Agent · co-authored-by · generated-with</text><text x="24" y="426" fill="#e76ab7" font-size="11" font-weight="600" letter-spacing="2.5">WRITES</text><rect x="24" y="440" width="352" height="50" rx="9" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="38" y="461" fill="#f6eefd" font-size="11.5" font-weight="600" class="mono">terminal table</text><text x="38" y="479" fill="#ae9cc4" font-size="10">intent . agent . files . review . conf</text><rect x="24" y="498" width="352" height="50" rx="9" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="38" y="519" fill="#f6eefd" font-size="11.5" font-weight="600" class="mono">stdout JSON</text><text x="38" y="537" fill="#ae9cc4" font-size="10">histfold fold --json</text><rect x="24" y="556" width="352" height="50" rx="9" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="38" y="577" fill="#f6eefd" font-size="11.5" font-weight="600" class="mono">histfold.html</text><text x="38" y="595" fill="#ae9cc4" font-size="10">self-contained foldable timeline</text><rect x="24" y="620" width="352" height="46" rx="10" fill="#12101f" stroke="#351841" stroke-width="1"/><circle cx="44" cy="643" r="3.6" fill="#d056e6" class="pulse"/><text x="56" y="639" fill="#ae9cc4" font-size="10.5">review status from local refs only -</text><text x="56" y="655" fill="#ae9cc4" font-size="10.5">no network requests</text></svg>