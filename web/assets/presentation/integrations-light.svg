<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" data-palette="d056e6-e76ab7-d0acf6-06806248da20" role="img" aria-labelledby="integrations-light-title integrations-light-desc"><title id="integrations-light-title">What it reads and writes</title><desc id="integrations-light-desc">histfold draws evidence from git log, Claude Code session logs and commit trailers, and writes a terminal table, stdout JSON and histfold.html; review status uses local refs only, with no network requests.</desc><style>text{font-family:Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans',sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.flow{stroke-dasharray:6 7;animation:flow 5.5s linear infinite}.flow-slow{stroke-dasharray:4 9;animation:flow 8s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.pulse-slow{animation:pulse 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-390}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="470" fill="#fdf9fe"/><rect width="1000" height="470" fill="url(#grid)" opacity=".5"/><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#d056e6"/><stop offset=".55" stop-color="#e76ab7"/>
<stop offset="1" stop-color="#d0acf6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#d056e6" stop-opacity="0.14"/>
<stop offset="1" stop-color="#d056e6" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#f0cbf7" stroke-opacity=".33" stroke-width=".6"/>
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
<path d="m1 1 7 4-7 4" fill="none" stroke="#d056e6" stroke-width="1.6"/></marker>
</defs><rect x="24" y="22" width="3" height="26" rx="1.5" fill="" stroke="#aa46bb" stroke-width="1"/><text x="40" y="38" fill="#6e5e88" font-size="12.5" letter-spacing="2">INTEGRATION / READS AND WRITES</text><text x="40" y="74" fill="#241630" font-size="27" font-weight="600">Histfold / what it touches</text><circle cx="500" cy="262" r="86" fill="#fdf7fe" stroke="#d056e6" stroke-width="1.4"/><circle cx="500" cy="262" r="102" fill="none" stroke="#d056e6" stroke-opacity=".35" class="pulse-slow"/><text x="500" y="258" fill="#241630" font-size="17" font-weight="600" text-anchor="middle">histfold</text><text x="500" y="280" fill="#6e5e88" font-size="11" text-anchor="middle">read-only fold</text><rect x="48" y="132" width="288" height="54" rx="9" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="62" y="155" fill="#241630" font-size="12" font-weight="600" class="mono">git log --numstat</text><text x="62" y="173" fill="#6e5e88" font-size="10.5">via the system git binary</text><line x1="340" y1="159" x2="404" y2="236" stroke="#d056e6" stroke-width="1.4" class="flow-slow" marker-end="url(#arrow)"/><rect x="48" y="210" width="288" height="54" rx="9" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="62" y="233" fill="#241630" font-size="12" font-weight="600" class="mono">~/.claude/projects/*.jsonl</text><text x="62" y="251" fill="#6e5e88" font-size="10.5">Claude Code session logs (v0.1)</text><line x1="340" y1="237" x2="396" y2="262" stroke="#d056e6" stroke-width="1.4" class="flow-slow" marker-end="url(#arrow)"/><rect x="48" y="288" width="288" height="54" rx="9" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="62" y="311" fill="#241630" font-size="12" font-weight="600" class="mono">commit trailers</text><text x="62" y="329" fill="#6e5e88" font-size="10.5">Agent · co-authored-by · generated-with</text><line x1="340" y1="315" x2="404" y2="288" stroke="#d056e6" stroke-width="1.4" class="flow-slow" marker-end="url(#arrow)"/><rect x="664" y="132" width="288" height="54" rx="9" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="678" y="155" fill="#241630" font-size="12" font-weight="600" class="mono">terminal table</text><text x="678" y="173" fill="#6e5e88" font-size="10.5">intent . agent . files . review . conf</text><line x1="596" y1="236" x2="660" y2="159" stroke="#e76ab7" stroke-width="1.4" class="flow-slow" marker-end="url(#arrow)"/><rect x="664" y="210" width="288" height="54" rx="9" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="678" y="233" fill="#241630" font-size="12" font-weight="600" class="mono">stdout JSON</text><text x="678" y="251" fill="#6e5e88" font-size="10.5">histfold fold --json</text><line x1="596" y1="262" x2="660" y2="237" stroke="#e76ab7" stroke-width="1.4" class="flow-slow" marker-end="url(#arrow)"/><rect x="664" y="288" width="288" height="54" rx="9" fill="#fcf3fd" stroke="#f0cbf7" stroke-width="1"/><text x="678" y="311" fill="#241630" font-size="12" font-weight="600" class="mono">histfold.html</text><text x="678" y="329" fill="#6e5e88" font-size="10.5">self-contained foldable timeline</text><line x1="596" y1="288" x2="660" y2="315" stroke="#e76ab7" stroke-width="1.4" class="flow-slow" marker-end="url(#arrow)"/><text x="48" y="112" fill="#d056e6" font-size="11.5" font-weight="600" letter-spacing="2.5">READS</text><text x="664" y="112" fill="#e76ab7" font-size="11.5" font-weight="600" letter-spacing="2.5">WRITES</text><rect x="48" y="392" width="904" height="46" rx="10" fill="#fdf7fe" stroke="#f0cbf7" stroke-width="1"/><circle cx="70" cy="415" r="4" fill="#d056e6" class="pulse"/><text x="84" y="420" fill="#6e5e88" font-size="12">review status from local refs only - no network requests  ·  repos without session logs still fold on trailers + time gaps (lower confidence)</text></svg>