<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" data-palette="d056e6-e76ab7-d0acf6-06806248da20" role="img" aria-labelledby="process-dark-mobile-title process-dark-mobile-desc"><title id="process-dark-mobile-title">How a fold happens</title><desc id="process-dark-mobile-desc">The commit stream and session logs enter correlation; commits are attributed with 90/70/50/20 percent confidence and changesets come out with intent and review status, while human commits pass through unattributed.</desc><style>text{font-family:Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans',sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.flow{stroke-dasharray:6 7;animation:flow 5.5s linear infinite}.flow-slow{stroke-dasharray:4 9;animation:flow 8s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.pulse-slow{animation:pulse 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-390}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="400" height="640" fill="#090712"/><rect width="400" height="640" fill="url(#grid)" opacity=".5"/><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#d056e6"/><stop offset=".55" stop-color="#e76ab7"/>
<stop offset="1" stop-color="#d0acf6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#d056e6" stop-opacity="0.14"/>
<stop offset="1" stop-color="#d056e6" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#351841" stroke-opacity=".33" stroke-width=".6"/>
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
<path d="m1 1 7 4-7 4" fill="none" stroke="#d056e6" stroke-width="1.6"/></marker>
</defs><text x="24" y="44" fill="#ae9cc4" font-size="11.5" letter-spacing="1.5">FOLD / HOW A FOLD HAPPENS</text><rect x="24" y="74" width="352" height="84" rx="10" fill="#12101f" stroke="#351841" stroke-width="1"/><text x="44" y="108" fill="#f6eefd" font-size="16.5" font-weight="600">01 Collect</text><text x="44" y="130" fill="#ae9cc4" font-size="11.5">git log --numstat + 8 session logs</text><line x1="200" y1="164" x2="200" y2="180" stroke="#d056e6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="24" y="186" width="352" height="84" rx="10" fill="#12101f" stroke="#d056e6" stroke-width="1.3"/><text x="44" y="220" fill="#d056e6" font-size="16.5" font-weight="600">02 Correlate</text><text x="44" y="242" fill="#ae9cc4" font-size="11.5">activity window . touched-path overlap .</text><text x="44" y="259" fill="#ae9cc4" font-size="11.5">agent trailers</text><line x1="200" y1="276" x2="200" y2="292" stroke="#d056e6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="24" y="298" width="352" height="84" rx="10" fill="#12101f" stroke="#351841" stroke-width="1"/><text x="44" y="332" fill="#f6eefd" font-size="16.5" font-weight="600">03 Changesets</text><text x="44" y="354" fill="#ae9cc4" font-size="11.5">intent . agent . files . review status</text><text x="24" y="418" fill="#ae9cc4" font-size="12.5">confidence tiers</text><rect x="24" y="436" width="60" height="24" rx="7" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="54" y="452.5" fill="#d056e6" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">90%</text><text x="96" y="452.5" fill="#ae9cc4" font-size="11.5">session window + path overlap</text><rect x="24" y="468" width="60" height="24" rx="7" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="54" y="484.5" fill="#d056e6" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">70%</text><text x="96" y="484.5" fill="#ae9cc4" font-size="11.5">session window</text><rect x="24" y="500" width="60" height="24" rx="7" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="54" y="516.5" fill="#d056e6" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">50%</text><text x="96" y="516.5" fill="#ae9cc4" font-size="11.5">trailers only</text><rect x="24" y="532" width="60" height="24" rx="7" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="54" y="548.5" fill="#d056e6" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">20%</text><text x="96" y="548.5" fill="#ae9cc4" font-size="11.5">time gaps</text><text x="24" y="580" fill="#ae9cc4" font-size="11">human commits pass through unattributed (-)</text></svg>