<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" data-palette="d056e6-e76ab7-d0acf6-06806248da20" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc"><title id="architecture-dark-title">One binary, three packages</title><desc id="architecture-dark-desc">Inside the histfold single binary: ingest shells out to system git and adapts Claude Code session logs, fold is a pure correlation function, render prints a terminal table and writes a self-contained HTML timeline.</desc><style>text{font-family:Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans',sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.flow{stroke-dasharray:6 7;animation:flow 5.5s linear infinite}.flow-slow{stroke-dasharray:4 9;animation:flow 8s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.pulse-slow{animation:pulse 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-390}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="540" fill="#090712"/><rect width="1000" height="540" fill="url(#grid)" opacity=".5"/><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#d056e6"/><stop offset=".55" stop-color="#e76ab7"/>
<stop offset="1" stop-color="#d0acf6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#d056e6" stop-opacity="0.12"/>
<stop offset="1" stop-color="#d056e6" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#351841" stroke-opacity=".33" stroke-width=".6"/>
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
<path d="m1 1 7 4-7 4" fill="none" stroke="#d056e6" stroke-width="1.6"/></marker>
</defs><rect x="24" y="22" width="3" height="26" rx="1.5" fill="" stroke="#d056e6" stroke-width="1"/><text x="40" y="38" fill="#ae9cc4" font-size="12.5" letter-spacing="2">ARCHITECTURE / ONE BINARY, THREE PACKAGES</text><text x="40" y="74" fill="#f6eefd" font-size="27" font-weight="600">Histfold / single static binary</text><rect x="200" y="108" width="470" height="300" rx="14" fill="#12101f" stroke="#d056e6" stroke-width="1.4"/><text x="224" y="138" fill="#f6eefd" font-size="14" font-weight="600">histfold  ·  single binary  ·  Go stdlib</text><text x="224" y="158" fill="#ae9cc4" font-size="11.5">no servers, no daemons</text><rect x="224" y="176" width="130" height="200" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="240" y="204" fill="#f6eefd" font-size="16.5" font-weight="600">ingest</text><text x="240" y="223" fill="#ae9cc4" font-size="11">system boundaries</text><circle cx="246" cy="240.5" r="2.2" fill="#e76ab7"/><text x="256" y="244" fill="#ae9cc4" font-size="11">git exec</text><circle cx="246" cy="257.5" r="2.2" fill="#e76ab7"/><text x="256" y="261" fill="#ae9cc4" font-size="11">claude jsonl</text><circle cx="246" cy="274.5" r="2.2" fill="#e76ab7"/><text x="256" y="278" fill="#ae9cc4" font-size="11">trailers</text><rect x="372" y="176" width="130" height="200" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="388" y="204" fill="#f6eefd" font-size="16.5" font-weight="600">fold</text><text x="388" y="223" fill="#ae9cc4" font-size="11">pure functions</text><circle cx="394" cy="240.5" r="2.2" fill="#e76ab7"/><text x="404" y="244" fill="#ae9cc4" font-size="11">correlation</text><circle cx="394" cy="257.5" r="2.2" fill="#e76ab7"/><text x="404" y="261" fill="#ae9cc4" font-size="11">no I/O</text><circle cx="394" cy="274.5" r="2.2" fill="#e76ab7"/><text x="404" y="278" fill="#ae9cc4" font-size="11">one policy</text><rect x="520" y="176" width="130" height="200" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="536" y="204" fill="#f6eefd" font-size="16.5" font-weight="600">render</text><text x="536" y="223" fill="#ae9cc4" font-size="11">output layer</text><circle cx="542" cy="240.5" r="2.2" fill="#e76ab7"/><text x="552" y="244" fill="#ae9cc4" font-size="11">terminal table</text><circle cx="542" cy="257.5" r="2.2" fill="#e76ab7"/><text x="552" y="261" fill="#ae9cc4" font-size="11">timeline.html</text><circle cx="542" cy="274.5" r="2.2" fill="#e76ab7"/><text x="552" y="278" fill="#ae9cc4" font-size="11">stdlib tpl + JS</text><line x1="358" y1="276" x2="368" y2="276" stroke="#d056e6" stroke-width="1.6" class="flow"/><circle cx="363" cy="276" r="2.6" fill="#d056e6" class="pulse"/><line x1="506" y1="276" x2="516" y2="276" stroke="#d056e6" stroke-width="1.6" class="flow"/><circle cx="511" cy="276" r="2.6" fill="#d056e6" class="pulse"/><rect x="30" y="128" width="150" height="84" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="44" y="152" fill="#f6eefd" font-size="13" font-weight="600">your repo</text><text x="44" y="172" fill="#ae9cc4" font-size="9.5" class="mono">git log --numstat</text><text x="44" y="190" fill="#ae9cc4" font-size="10.5">read-only</text><rect x="30" y="296" width="150" height="84" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="44" y="320" fill="#f6eefd" font-size="13" font-weight="600">session logs</text><text x="44" y="340" fill="#ae9cc4" font-size="9.5" class="mono">~/.claude/projects/</text><text x="44" y="356" fill="#ae9cc4" font-size="9.5" class="mono">&lt;repo-slug&gt;/*.jsonl</text><line x1="184" y1="170" x2="196" y2="210" stroke="#d056e6" stroke-width="1.5" class="flow-slow" marker-end="url(#arrow)"/><line x1="184" y1="338" x2="196" y2="280" stroke="#d056e6" stroke-width="1.5" class="flow-slow" marker-end="url(#arrow)"/><rect x="710" y="128" width="260" height="84" rx="10" fill="#120d1d" stroke="#351841" stroke-width="1"/><text x="724" y="152" fill="#f6eefd" font-size="13" font-weight="600">terminal summary</text><text x="724" y="172" fill="#ae9cc4" font-size="10.5">intent . agent . conf</text><rect x="710" y="296" width="260" height="84" rx="10" fill="#120d1d" stroke="#d056e6" stroke-width="1"/><text x="724" y="320" fill="#f6eefd" font-size="13" font-weight="600">histfold.html</text><text x="724" y="340" fill="#ae9cc4" font-size="10.5">self-contained timeline</text><text x="724" y="356" fill="#ae9cc4" font-size="10.5">offline - zero external requests</text><line x1="672" y1="210" x2="706" y2="170" stroke="#d056e6" stroke-width="1.5" class="flow-slow" marker-end="url(#arrow)"/><line x1="672" y1="300" x2="706" y2="338" stroke="#d056e6" stroke-width="1.5" class="flow-slow" marker-end="url(#arrow)"/><text x="40" y="470" fill="#ae9cc4" font-size="12">ingest shells out to the system git; fold policy lives in exactly one place; render embeds its template - no CDN, no hooks.</text></svg>